# Default value for any setting (new players). Use ON / OFF / ANYONE / FRIENDS.
# Key = setting name in lowercase. Example:
# defaults:
#   fast_crystals: ON
defaults: {}

# Commands (from other plugins) that are checked against the TARGET's privacy settings.
# The first argument must be the target player's name.
guarded-commands:
  private-message: [msg, tell, w, whisper, m, pm, t]
  teleport-request: [tpa, tpask, call, etpa]
  teleport-here-request: [tpahere, etpahere, tpaskhere]
  payment: [pay, epay]

combat:
  duration-seconds: 15

general:
  task-interval-ticks: 100   # how often Night Vision / mob / phantom spawning runs

mob-spawns:
  per-cycle: 2
  max-nearby: 8
  min-distance: 10
  max-distance: 24
  types: [ZOMBIE, SKELETON, SPIDER, CREEPER]

phantom-spawns:
  per-cycle: 1
  max-nearby: 3

# Commands run (as the player) whenever they change these settings in the menu
commands:
  quick-buy: "ah fastbuy"
  quick-sell: "ah fastsell"

# ---------------------------------------------------------------------------
# Alerts: chat / action-bar messages from your other plugins are recognised by their text
# (case-insensitive regex, small-caps are converted to normal letters first) and hidden for players
# who turned the matching alert OFF in /settings. First matching group wins (pay is checked first).
# ---------------------------------------------------------------------------
alerts:
  pay:
    - 'received\b.*\bfrom\b'            # Essentials /pay, QuickShop "/shards pay"
    - 'has been received from'
  teleport:
    - 'wants you to teleport to them'    # JalebiTPA incoming /tpahere
    - 'wants to teleport to you'         # JalebiTPA incoming /tpa
    - '\[\s*accept\s*\].*\[\s*deny\s*\]' # JalebiTPA accept / deny buttons line
    - 'accepted your request'
    - 'denied your request'
    - 'has requested (to teleport to you|that you teleport to them)'   # EssentialsX
    - 'to teleport, type /tpaccept'
  bounty:
    - 'claimed the .* bounty on'
    - 'to the bounty on'
  order:
    - '\byour order\b'                   # "Your order for X was filled by Y" / filled while you were away
  auction:
    - 'returned your unsold item'
    - 'your (auction|listing|item)s?\b.*\b(sold|expired)'
  shard:
    - '\+\s*[\d,]+\s*shards?\b'          # "+10 shards" after a kill
    - 'awarded .*shards?'                # playtime reward

